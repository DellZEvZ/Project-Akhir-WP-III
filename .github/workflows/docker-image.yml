name: Build and Push Docker Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Private Registry
        uses: docker/login-action@v3
        with:
          registry: dkr-reg.serenetia.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Nama image DITETAPKAN (bukan dari nama repo): server menarik nama ini lewat
          # docker-compose.yml. Dulu nama diambil dari nama repo, sehingga setelah repo
          # diganti nama menjadi "...-WP-III" image terdorong ke "...-wp-iii" dan server
          # (yang menarik "...-wp-ii") tidak pernah ter-update. Samakan dengan compose.
          images: dkr-reg.serenetia.com/dellzevz/project-akhir-wp-ii
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
