services:
  app:
    #build:
    #  context: .
    #  dockerfile: Dockerfile
    # Untuk deploy image hasil CI (bukan build lokal), ganti blok build di atas
    image: dkr-reg.serenetia.com/dellzevz/project-akhir-wp-ii:latest
    container_name: pawp2_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: ${APP_NAME:-BarberFlow}
      # APP_ENV dan APP_DEBUG SENGAJA dikunci (tanpa ${...}) agar variabel dari
      # panel deploy tidak bisa menyalakan debug di produksi. APP_DEBUG=true
      # membuka rute quick-login (login admin tanpa password) dan stack trace.
      APP_ENV: production
      # APP_KEY di-set eksplisit agar konsisten antar restart/redeploy. Untuk
      # produksi nyata, override lewat environment variable platform deploy.
      APP_KEY: ${APP_KEY:-base64:AMGr55gxQLgfvGdu5mulNDJysOE3fNLv0HVdUE9cQsA=}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8000}

      # ==== MySQL EKSTERNAL — WAJIB diisi (tidak ada default host) ====
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # Session & cache memakai disk LOKAL container, bukan database.
      # Alasan: database berada di server terpisah dengan latensi tinggi
      # (~1 detik per query). Driver "database" menambah 2-3 roundtrip DB pada
      # SETIAP request. Driver "file" menulis ke volume storage -> ~0 ms.
      # Catatan: "file" hanya cocok untuk SATU container app. Kalau nanti
      # di-scale ke banyak container, pindahkan ke "redis" (bersama).
      # Dikunci ke file (bukan ${...}) supaya override panel tidak mengembalikan ke database.
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}

      # Redis eksternal (dipakai hanya jika driver di atas di-set "redis").
      REDIS_CLIENT: phpredis
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-null}

      MAIL_MAILER: ${MAIL_MAILER:-log}
      # Index database Redis terpisah (bukan 0) agar tidak bentrok dengan app
      # lain yang berbagi instance Redis eksternal yang sama.
      # default (session/queue) -> REDIS_DB, cache -> REDIS_CACHE_DB.
      REDIS_DB: ${REDIS_DB:-1}
      REDIS_CACHE_DB: ${REDIS_CACHE_DB:-2}

      RAJAONGKIR_API_KEY: ${RAJAONGKIR_API_KEY}
      RAJAONGKIR_BASE_URL: ${RAJAONGKIR_BASE_URL:-https://rajaongkir.komerce.id/api/v1}
      RAJAONGKIR_ORIGIN: ${RAJAONGKIR_ORIGIN}

      # Google OAuth untuk login customer. Kalau GOOGLE_REDIRECT_URL kosong,
      # Socialite tidak mengirim redirect_uri -> Google menolak dengan
      # "Missing required parameter: redirect_uri".
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL}
    volumes:
      # Persist file yang diunggah (gambar). Pada pembuatan pertama, volume ini
      # otomatis diisi dari isi folder storage di image (termasuk gambar seed).
      - storage_data:/var/www/html/storage

volumes:
  storage_data:
